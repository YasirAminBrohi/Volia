<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 128" role="img" aria-labelledby="title desc">
  <title id="title">Volia logo</title>
  <desc id="desc">Volia wordmark with a luminous V-shaped icon.</desc>
  <defs>
    <linearGradient id="bg" x1="16" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.45" stop-color="#17112f"/>
      <stop offset="1" stop-color="#061a14"/>
    </linearGradient>
    <linearGradient id="vLeft" x1="32" y1="27" x2="70" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="vRight" x1="96" y1="25" x2="61" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.48" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="spark" x1="48" y1="34" x2="88" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="word" x1="140" y1="34" x2="344" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#d8b4fe"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.38 0 0 0 0 0.28 0 0 0 0 1 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <path d="M25 26c10 0 18 6 22 17l16 43-16 31L25 26Z" fill="url(#vLeft)" filter="url(#glow)"/>
  <path d="M109 26c-10 0-18 6-22 17L62 113l16-31 31-56Z" fill="url(#vRight)" filter="url(#glow)"/>
  <path d="M63 25v45" stroke="url(#spark)" stroke-width="7" stroke-linecap="round"/>
  <path d="M49 58 63 72l14-14" fill="none" stroke="url(#spark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="31" r="5" fill="#86efac"/>

  <text x="146" y="72" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="900">Volia</text>
  <text x="150" y="99" fill="#8b8bad" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Powered by NAAADLI</text>
</svg>
