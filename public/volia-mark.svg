<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Volia icon</title>
  <desc id="desc">A luminous V-shaped mark for Volia, inspired by freedom, motion, and digital access.</desc>
  <defs>
    <linearGradient id="bg" x1="16" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.45" stop-color="#17112f"/>
      <stop offset="1" stop-color="#061a14"/>
    </linearGradient>
    <linearGradient id="vLeft" x1="32" y1="27" x2="70" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="vRight" x1="96" y1="25" x2="61" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.48" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="spark" x1="48" y1="34" x2="88" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.38 0 0 0 0 0.28 0 0 0 0 1 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M18 91C30 110 48 120 64 120s34-10 46-29" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.18"/>
  <path d="M24 27c12 0 21 7 26 20l15 39 17-42c5-12 14-18 27-17L75 104c-2 5-6 8-11 8s-9-3-11-8L24 27Z" fill="#0b1022" opacity="0.7"/>
  <path d="M27 26c10 0 18 6 22 17l16 43-16 31L27 26Z" fill="url(#vLeft)" filter="url(#glow)"/>
  <path d="M111 26c-10 0-18 6-22 17L64 113l16-31 31-56Z" fill="url(#vRight)" filter="url(#glow)"/>
  <path d="M64 25v45" stroke="url(#spark)" stroke-width="7" stroke-linecap="round"/>
  <path d="M50 58 64 72l14-14" fill="none" stroke="url(#spark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="91" cy="31" r="5" fill="#86efac"/>
  <circle cx="35" cy="97" r="3" fill="#a78bfa" opacity="0.9"/>
</svg>
